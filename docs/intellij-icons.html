<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Viewer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(8, 90px);
    gap: 10px;
    justify-content: center;
  }

  .group-header {
    grid-column: 1 / -1;
    font-size: 13px;
    font-weight: 600;
    color: var(--bs-secondary-color);
    padding: 12px 0 2px;
    border-bottom: 1px solid var(--bs-border-color);
    margin-bottom: -2px;
  }
  .group-header:first-child { padding-top: 0; }

  .icon-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 90px; height: 90px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .icon-card:hover { background: var(--bs-tertiary-bg); }
  .icon-card.selected { background: var(--bs-primary-bg-subtle); }

  .icon-card img {
    width: 28px; height: 28px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .icon-card .placeholder {
    width: 28px; height: 28px;
    flex-shrink: 0;
  }
  .icon-card .name {
    margin-top: 4px;
    font-size: 10px;
    color: var(--bs-secondary-color);
    text-align: center;
    word-break: break-all;
    line-height: 1.2;
    max-height: 2.4em;
    overflow: hidden;
    width: 100%;
    padding: 0 2px;
  }

  .sentinel { height: 1px; }

  .detail-panel {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: var(--bs-body-bg);
    border: 1px solid var(--bs-border-color);
    border-radius: 8px;
    padding: 10px 16px;
    display: none; align-items: center; gap: 16px;
    z-index: 1050;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .detail-panel.visible { display: flex; }
  .detail-panel table {
    font-size: 13px;
  }
  .detail-panel th {
    font-weight: 500;
    color: var(--bs-secondary-color);
    padding-right: 12px;
    white-space: nowrap;
    vertical-align: top;
    padding-bottom: 2px;
  }
  .detail-panel td {
    padding-bottom: 2px;
  }
  .detail-panel td.path-cell {
    user-select: all;
    color: var(--bs-secondary-color);
    font-size: 11px;
  }
  .detail-panel .previews {
    display: flex; gap: 8px;
  }
  .detail-panel .preview-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 90px; height: 90px;
    border-radius: 6px;
  }
  .detail-panel .preview-box.dark-preview { background: #1e1e1e; }
  .detail-panel .preview-box.light-preview { background: #f0f0f0; }
  .detail-panel .preview-box img { width: 28px; height: 28px; object-fit: contain; }
  .detail-panel .preview-box span { font-size: 9px; }
  .detail-panel .preview-box.dark-preview span { color: #aaa; }
  .detail-panel .preview-box.light-preview span { color: #666; }

  [data-bs-theme="light"] .icon-grid .icon-card { background: #f5f5f5; }
  [data-bs-theme="light"] .icon-grid .icon-card:hover { background: #e8e8e8; }
  [data-bs-theme="light"] .icon-grid .icon-card.selected { background: #b8d4f0; }
</style>
</head>
<body>

<nav class="navbar sticky-top bg-body-tertiary border-bottom">
  <div class="d-flex align-items-center mx-auto" style="width:790px">
    <span class="text-secondary small text-nowrap" id="stats"></span>
    <input class="form-control form-control-sm mx-auto" type="text" placeholder="Search icons..." autofocus id="search" style="max-width:400px">
    <button class="btn btn-sm btn-outline-secondary" id="theme-toggle" title="Toggle theme">
      <i class="bi bi-sun-fill" id="theme-icon"></i>
    </button>
  </div>
</nav>

<div class="container py-3">
  <div class="icon-grid" id="grid"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="text-center py-4 text-secondary small" id="loading">Loading index...</div>
</div>

<div class="detail-panel" id="detail">
  <div class="previews" id="detail-previews"></div>
  <table>
    <tr><th>Name</th><td id="detail-name"></td></tr>
    <tr><th>Group</th><td id="detail-group"></td></tr>
    <tr><th>Path</th><td class="path-cell" id="detail-path"></td></tr>
  </table>
  <button type="button" class="btn-close" id="detail-close"></button>
</div>

<script>
// Theme: detect browser preference
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
let darkMode = prefersDark.matches;
const themeIcon = document.getElementById('theme-icon');

function applyTheme() {
  document.documentElement.setAttribute('data-bs-theme', darkMode ? 'dark' : 'light');
  themeIcon.className = darkMode ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
}
applyTheme();
prefersDark.addEventListener('change', e => {
  darkMode = e.matches;
  applyTheme();
  updateIconVariants();
});

const BASE_URL = 'https://raw.githubusercontent.com/consulo/intellij-icons/master/';
const INDEX_URL = BASE_URL + 'index.json';
const PAGE_SIZE = 200;
const DEBOUNCE_MS = 250;

const searchBox = document.getElementById('search');
const grid = document.getElementById('grid');
const sentinel = document.getElementById('sentinel');
const loadingEl = document.getElementById('loading');
const statsEl = document.getElementById('stats');
const themeToggle = document.getElementById('theme-toggle');
const detail = document.getElementById('detail');
const detailPreviews = document.getElementById('detail-previews');
const detailName = document.getElementById('detail-name');
const detailGroup = document.getElementById('detail-group');
const detailPath = document.getElementById('detail-path');
const detailClose = document.getElementById('detail-close');

let allIcons = [];
let allLower = [];
let filtered = [];
let offset = 0;
let currentQuery = '';
let lastGroup = '';

function toUrl(p) {
  return BASE_URL + p.split('/').map(encodeURIComponent).join('/');
}

function baseName(entry) {
  const p = entry[0] || entry[1];
  return p.split('/').pop().replace('_dark.svg', '.svg').replace('.svg', '');
}

async function init() {
  loadingEl.textContent = 'Loading index...';
  try {
    const res = await fetch(INDEX_URL);
    allIcons = await res.json();
    allLower = allIcons.map(([l, d]) => (l || d).toLowerCase());
    applyFilter();
    loadingEl.textContent = '';
  } catch (e) {
    loadingEl.textContent = 'Failed to load index.json';
  }
}

function applyFilter() {
  const q = currentQuery.toLowerCase().trim();
  const terms = q ? q.split(/\s+/) : [];

  filtered = [];
  for (let i = 0; i < allIcons.length; i++) {
    const low = allLower[i];
    if (terms.length && !terms.every(t => low.includes(t))) continue;
    filtered.push(allIcons[i]);
  }

  offset = 0;
  lastGroup = '';
  grid.innerHTML = '';
  statsEl.textContent = `${filtered.length} icons`;
  renderBatch();
  requestAnimationFrame(checkScroll);
}

function pickSrc(entry) {
  const [light, dark] = entry;
  if (darkMode) return dark || light;
  return light || dark;
}

function renderBatch() {
  if (offset >= filtered.length) {
    loadingEl.textContent = filtered.length === 0 ? 'No icons found' : '';
    return;
  }

  const batch = filtered.slice(offset, offset + PAGE_SIZE);
  offset += batch.length;

  const frag = document.createDocumentFragment();
  for (const entry of batch) {
    const name = baseName(entry);
    const group = (entry[0] || entry[1]).split('/')[0];
    const src = pickSrc(entry);

    if (group !== lastGroup) {
      lastGroup = group;
      const header = document.createElement('div');
      header.className = 'group-header';
      header.textContent = group;
      frag.appendChild(header);
    }

    const card = document.createElement('div');
    card.className = 'icon-card';
    card.dataset.src = toUrl(src);
    card.dataset.light = entry[0] || '';
    card.dataset.dark = entry[1] || '';
    card.dataset.name = name;
    card.dataset.group = group;
    card.innerHTML = `<div class="placeholder"></div><div class="name">${escHtml(name)}</div>`;
    card.addEventListener('click', () => showDetail(card));
    frag.appendChild(card);
    imgObserver.observe(card);
  }
  grid.appendChild(frag);
  loadingEl.textContent = '';
}

// Lazy image loading + unloading
const imgObserver = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    const card = entry.target;
    if (entry.isIntersecting) {
      if (!card.querySelector('img')) {
        const img = document.createElement('img');
        img.decoding = 'async';
        img.loading = 'lazy';
        img.alt = card.dataset.name;
        img.src = card.dataset.src;
        const placeholder = card.querySelector('.placeholder');
        if (placeholder) placeholder.replaceWith(img);
        else card.prepend(img);
      }
    } else {
      const img = card.querySelector('img');
      if (img) {
        const placeholder = document.createElement('div');
        placeholder.className = 'placeholder';
        img.replaceWith(placeholder);
      }
    }
  }
}, { rootMargin: '300px' });

// Infinite scroll
function checkScroll() {
  if (offset >= filtered.length) return;
  const scrollBottom = window.scrollY + window.innerHeight;
  const docHeight = document.documentElement.scrollHeight;
  if (scrollBottom + 800 >= docHeight) {
    renderBatch();
  }
}
window.addEventListener('scroll', checkScroll, { passive: true });
window.addEventListener('resize', checkScroll, { passive: true });

// Debounced search
let debounceTimer;
searchBox.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    currentQuery = searchBox.value;
    applyFilter();
  }, DEBOUNCE_MS);
});

// Theme toggle: page theme + icon variant
function updateIconVariants() {
  grid.querySelectorAll('.icon-card').forEach(card => {
    const light = card.dataset.light;
    const dark = card.dataset.dark;
    const newSrc = darkMode ? (dark || light) : (light || dark);
    if (newSrc) {
      const url = toUrl(newSrc);
      card.dataset.src = url;
      const img = card.querySelector('img');
      if (img) img.src = url;
    }
  });
}

themeToggle.addEventListener('click', () => {
  darkMode = !darkMode;
  applyTheme();
  updateIconVariants();
});

function showDetail(card) {
  document.querySelectorAll('.icon-card.selected').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  const light = card.dataset.light;
  const dark = card.dataset.dark;

  detailPreviews.innerHTML = '';
  if (light) {
    detailPreviews.innerHTML += `<div class="preview-box light-preview"><img src="${escHtml(toUrl(light))}" alt="light"><span>light</span></div>`;
  }
  if (dark) {
    detailPreviews.innerHTML += `<div class="preview-box dark-preview"><img src="${escHtml(toUrl(dark))}" alt="dark"><span>dark</span></div>`;
  }

  detailName.textContent = card.dataset.name;
  detailGroup.textContent = card.dataset.group;
  detailPath.textContent = light || dark;
  detail.classList.add('visible');
}

detailClose.addEventListener('click', () => {
  detail.classList.remove('visible');
  document.querySelectorAll('.icon-card.selected').forEach(c => c.classList.remove('selected'));
});

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
